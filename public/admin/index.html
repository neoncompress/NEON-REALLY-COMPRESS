<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON Admin</title><style>body{background:#13080e;color:#fff;font:15px system-ui;max-width:780px;margin:25px auto;padding:15px}input,textarea,button{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border-radius:9px}button{background:#f35;color:#fff;border:0;font-weight:bold}textarea{min-height:130px;background:#24131b;color:white}input{background:#24131b;color:white;border:1px solid #777}section{border:1px solid #70404f;padding:15px;border-radius:14px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>NEON ADMIN</h1><p>Log in from the main website with the configured ADMIN_EMAIL account, then open this page.</p><button id="load">LOAD ADMIN DATA</button><p id="msg"></p><section><h2>Settings</h2><label>Daily free limit<input id="limit" type="number" min="0"></label><label><input id="enabled" type="checkbox" style="display:inline;width:auto"> Enable daily limit</label><label><input id="maintenance" type="checkbox" style="display:inline;width:auto"> Maintenance mode</label><p>Point packages JSON</p><textarea id="packages"></textarea><p>Video size point pricing JSON</p><textarea id="pricing"></textarea><p>Payment accounts JSON (KBZPay, WavePay, uabpay)</p><textarea id="methods"></textarea><button id="save">SAVE SETTINGS</button></section><section><h2>Pending payments</h2><div id="requests"></div></section><script type="module">const $=id=>document.getElementById(id);let s;async function api(body){const r=await fetch('/api/admin',{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('neon_access_token')},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}async function load(){try{const d=await api();s=d.settings;$('limit').value=s.dailyLimit;$('enabled').checked=s.limitEnabled;$('maintenance').checked=s.maintenance;$('packages').value=JSON.stringify(s.pointPackages,null,2);$('pricing').value=JSON.stringify(s.sizePricing,null,2);$('methods').value=JSON.stringify(s.payments,null,2);$('requests').replaceChildren();for(const r of d.requests){const row=document.createElement('section');const info=document.createElement('pre');info.textContent=`${r.email} • ${r.points} points • ${r.ks} Ks\n${r.method} • Ref: ${r.reference}\n${r._id}`;row.append(info);for(const decision of ['approved','rejected']){const b=document.createElement('button');b.textContent=decision.toUpperCase();b.onclick=async()=>{if(!confirm(`Have you independently verified payment? ${decision}`))return;try{await api({action:'review',id:r._id,decision});await load();}catch(e){$('msg').textContent=e.message;}};row.append(b);}$('requests').append(row);}$('msg').textContent='Loaded';}catch(e){$('msg').textContent=e.message;}}$('load').onclick=load;$('save').onclick=async()=>{try{await api({action:'settings',dailyLimit:Number($('limit').value),limitEnabled:$('enabled').checked,maintenance:$('maintenance').checked,pointPackages:JSON.parse($('packages').value),sizePricing:JSON.parse($('pricing').value),payments:JSON.parse($('methods').value)});$('msg').textContent='Settings saved';}catch(e){$('msg').textContent=e.message;}};</script></html>
