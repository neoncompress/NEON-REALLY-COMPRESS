<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13080e">
<title>NEON Admin</title>

<style>
*{box-sizing:border-box}
body{
  background:#13080e;
  color:#fff;
  font:15px system-ui,sans-serif;
  max-width:780px;
  margin:25px auto;
  padding:15px
}
.back-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:auto;
  padding:10px 18px;
  margin:0 0 18px;
  background:#24131b;
  color:#fff;
  border:1px solid #70404f;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold
}
.back-btn:hover{background:#40202e}
input,textarea,button{
  display:block;
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:9px
}
button{
  background:#f35;
  color:#fff;
  border:0;
  font-weight:bold;
  cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
textarea{
  min-height:130px;
  background:#24131b;
  color:white;
  border:1px solid #70404f
}
input{
  background:#24131b;
  color:white;
  border:1px solid #777
}
input[type="checkbox"]{
  display:inline-block;
  width:auto;
  margin-right:8px
}
section{
  border:1px solid #70404f;
  padding:15px;
  border-radius:14px;
  margin:15px 0
}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
#msg{overflow-wrap:anywhere}
</style>
</head>

<body>

<a class="back-btn" href="/">← BACK</a>

<h1>NEON ADMIN</h1>

<p>Log in from the main website with the configured ADMIN_EMAIL account, then open this page.</p>

<button id="load">LOAD ADMIN DATA</button>
<p id="msg" role="status" aria-live="polite"></p>

<section>
  <h2>Settings</h2>

  <label>
    Daily free limit
    <input id="limit" type="number" min="0">
  </label>

  <label>
    <input id="enabled" type="checkbox">
    Enable daily limit
  </label>

  <label>
    <input id="maintenance" type="checkbox">
    Maintenance mode
  </label>

  <p>Point packages JSON</p>
  <textarea id="packages" spellcheck="false"></textarea>

  <p>Video size point pricing JSON</p>
  <textarea id="pricing" spellcheck="false"></textarea>

  <p>Payment accounts JSON (KBZPay, WavePay, uabpay)</p>
  <textarea id="methods" spellcheck="false"></textarea>

  <button id="save">SAVE SETTINGS</button>
</section>

<section>
  <h2>Pending payments</h2>
  <div id="requests"></div>
</section>

<script type="module">
const $ = id => document.getElementById(id);

async function api(body){
  const token = localStorage.getItem('neon_access_token');

  const r = await fetch('/api/admin',{
    method:body ? 'POST' : 'GET',
    headers:{
      'Content-Type':'application/json',
      Authorization:'Bearer ' + (token || '')
    },
    body:body ? JSON.stringify(body) : undefined
  });

  const d = await r.json();

  if(!r.ok) throw Error(d.error || 'Request failed');

  return d;
}

async function load(){
  $('load').disabled = true;
  $('msg').textContent = 'Loading...';

  try{
    const d = await api();
    const s = d.settings;

    $('limit').value = s.dailyLimit;
    $('enabled').checked = s.limitEnabled;
    $('maintenance').checked = s.maintenance;
    $('packages').value = JSON.stringify(s.pointPackages,null,2);
    $('pricing').value = JSON.stringify(s.sizePricing,null,2);
    $('methods').value = JSON.stringify(s.payments,null,2);

    $('requests').replaceChildren();

    for(const r of d.requests || []){
      const row = document.createElement('section');
      const info = document.createElement('pre');

      info.textContent =
        `${r.email} • ${r.points} points • ${r.ks} Ks\n` +
        `${r.method} • Ref: ${r.reference}\n` +
        `Request ID: ${r.id ?? r._id ?? 'Unavailable'}`;

      row.append(info);

      for(const decision of ['approved','rejected']){
        const b = document.createElement('button');
        b.textContent = decision.toUpperCase();

        b.onclick = async()=>{
          const id = r.id ?? r._id;

          if(!id){
            $('msg').textContent = 'Payment request ID is missing.';
            return;
          }

          if(!confirm(`Have you independently verified payment? ${decision}`)){
            return;
          }

          b.disabled = true;

          try{
            await api({action:'review',id,decision});
            await load();
          }catch(e){
            $('msg').textContent = e.message;
            b.disabled = false;
          }
        };

        row.append(b);
      }

      $('requests').append(row);
    }

    $('msg').textContent = 'Loaded';
  }catch(e){
    $('msg').textContent = e.message;
  }finally{
    $('load').disabled = false;
  }
}

$('load').onclick = load;

$('save').onclick = async()=>{
  $('save').disabled = true;
  $('msg').textContent = 'Saving...';

  try{
    await api({
      action:'settings',
      dailyLimit:Number($('limit').value),
      limitEnabled:$('enabled').checked,
      maintenance:$('maintenance').checked,
      pointPackages:JSON.parse($('packages').value),
      sizePricing:JSON.parse($('pricing').value),
      payments:JSON.parse($('methods').value)
    });

    $('msg').textContent = 'Settings saved';
  }catch(e){
    $('msg').textContent = e.message;
  }finally{
    $('save').disabled = false;
  }
};
</script>

</body>
</html>
