<div class="modal-section">
  <h3>BUY POINTS</h3>

  <div class="pay-grid">
    <label for="neonPackage">
      Point package
      <select id="neonPackage"></select>
    </label>

    <label for="neonMethod">
      Payment method
      <select id="neonMethod"></select>
    </label>

    <label for="neonReference">
      Payment transaction reference
      <input id="neonReference" placeholder="Transaction ID">
    </label>

    <button class="btn secondary" id="neonPay" type="button">
      SUBMIT PAYMENT FOR REVIEW
    </button>

    <p id="neonPaymentInfo" class="pay-help" aria-live="polite"></p>
  </div>
</div>
